# Disposable synthetic database only. No linked project or hosted credentials.
project_id = "vulpes-health-pr03-test"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 200
auto_expose_new_tables = false

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[realtime]
enabled = false

[studio]
enabled = false

[local_smtp]
enabled = false

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:4173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.email]
# This CLI maps this field to GOTRUE_EXTERNAL_EMAIL_ENABLED. The global
# auth.enable_signup=false blocks registration while allowing password sign-in.
enable_signup = true
enable_confirmations = true

[auth.sms]
enable_signup = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
