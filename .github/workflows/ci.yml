name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  VULPES_LIVE_AI_ENABLED: 'false'
  DO_NOT_TRACK: '1'

jobs:
  fast:
    name: Fast checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: package.json
          cache: npm
      - name: Install pinned npm and locked dependencies
        run: |
          npm install --global "$(node -p 'require("./package.json").packageManager')"
          npm ci
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      # test:bundle runs the full build (including typecheck) with secret canaries.
      - name: Production build and bundle secret checks
        run: npm run test:bundle
      - name: Specification validation
        run: python3 docs/spec/v0.1.0/scripts/validate_spec_package.py

  backend_integration:
    name: Backend integration checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: package.json
          cache: npm
      - name: Install pinned npm and locked dependencies
        run: |
          npm install --global "$(node -p 'require("./package.json").packageManager')"
          npm ci
      # The wrappers enforce the disposable loopback stack and hide startup keys.
      - name: Start disposable Supabase
        run: npm run db:start
      - name: Apply migrations from a clean database
        run: npm run db:reset:test
      - name: Populated lifecycle forward upgrade
        run: npm run test:lifecycle-upgrade -- --allow-disposable-reset
      - name: Database lint
        run: npm run db:lint
      - name: pgTAP tests
        run: npm run test:db
      - name: Database type consistency
        run: npm run db:types:check
      - name: HTTP and integration tests
        run: npm run test:integration
      - name: Synthetic accounting and adapter controls
        run: |
          npm run test:executions
          npm run test:evaluations
          npm run test:providers
      - name: Bounded lifecycle maintenance
        run: npm run maintenance:cleanup
      - name: Encrypted separate-environment restore and recovery
        run: npm run backup:verify
      - name: Stop disposable Supabase
        if: ${{ always() }}
        timeout-minutes: 2
        run: npm run db:stop

  browser_integration:
    name: Browser integration checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: package.json
          cache: npm
      - name: Install pinned npm and locked dependencies
        run: |
          npm install --global "$(node -p 'require("./package.json").packageManager')"
          npm ci
      - name: Install Chromium and system dependencies
        run: npx --no-install playwright install --with-deps chromium
      # The wrappers enforce the disposable loopback stack and hide startup keys.
      - name: Start disposable Supabase
        run: npm run db:start
      - name: Apply migrations from a clean database
        run: npm run db:reset:test
      # This runner rebuilds, provisions synthetic sessions in memory and redacts output.
      # Never upload browser reports, traces, screenshots, or local service logs.
      - name: Playwright Chromium tests
        run: npm run test:e2e
      - name: Static PWA privacy proof
        run: npm run test:pwa
      - name: Stop disposable Supabase
        if: ${{ always() }}
        timeout-minutes: 2
        run: npm run db:stop
